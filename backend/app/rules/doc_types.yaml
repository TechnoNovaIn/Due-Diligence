# Document taxonomy + deterministic classification signals.
#
# strong      : phrases that are near-conclusive for the type (weight 4)
# keywords    : supporting vocabulary (weight 1)
# negative    : phrases that argue against the type (weight -4)
# strong_kn   : Kannada equivalents of `strong`, merged in at load time
# keywords_kn : Kannada equivalents of `keywords`, merged in at load time
# label_kn    : the type's name in Kannada, used by the interface and the report
# fields      : structured extractors to run for this type
#
# The Kannada terms were compiled from common Karnataka revenue and registration
# usage. They should be reviewed by a Kannada-speaking property professional
# before the output is relied on - see docs/LIMITATIONS.md.

