  "name_kn": "ಪ್ರಸ್ತುತ ಹಕ್ಕು ದಾಖಲೆ (ನೋಂದಾಯಿತ ಕ್ರಯ / ದಾನ / ಪಾಲು / ಸಂಧಾನ ಪತ್ರ)"
  "reason_kn": "ಪ್ರಸ್ತುತ ಮಾಲೀಕರು ಸ್ವತ್ತನ್ನು ಹೇಗೆ ಪಡೆದರು ಎಂಬುದನ್ನು ಇದು ಸ್ಥಾಪಿಸುತ್ತದೆ; ಹಕ್ಕು ಸರಪಳಿಯ ಪ್ರಾರಂಭ ಇದೇ."
  "authority_kn": "ಜಿಲ್ಲಾ ಉಪ ನೋಂದಣಾಧಿಕಾರಿಗಳ ಕಚೇರಿ"
  "next_action_kn": "ನೋಂದಾಯಿತ ದಾಖಲೆ ಮತ್ತು ಅದರ ದೃಢೀಕೃತ ಪ್ರತಿಯನ್ನು ಉಪ ನೋಂದಣಾಧಿಕಾರಿಗಳಿಂದ ಪಡೆಯಿರಿ."
  "risk_if_absent_kn": "ಮಾಲೀಕತ್ವವನ್ನು ಪತ್ತೆಹಚ್ಚಲಾಗುವುದಿಲ್ಲ; ವ್ಯವಹಾರಕ್ಕೆ ವಿಶ್ವಾಸಾರ್ಹ ಆಧಾರವಿರುವುದಿಲ್ಲ."
  "closure_criteria_kn": "ಪ್ರಸ್ತುತ ಮಾಲೀಕರ ಹೆಸರಿನಲ್ಲಿ ನೋಂದಾಯಿತ ದಾಖಲೆ ಲಭ್ಯವಿದ್ದು, ಸ್ಪಷ್ಟವಾಗಿದ್ದು, ವಿಶ್ಲೇಷಿಸಲಾಗಿದೆ."
- "key": "parent_deeds_chain"
  "name": "Parent deeds covering the title chain for the customary review period"
  "category": "statutory"
  "priority": "mandatory"
  "property_types":
  - "all"
  "satisfied_by":
  - "mother_deed"
  - "sale_deed"
  - "partition_deed"
  - "gift_deed"
  - "settlement_deed"
  - "inheritance_document"
  - "court_order_ownership"
  - "release_deed"
  - "exchange_deed"
  "requires_chain_coverage": true
  "reason": "The title chain is customarily traced for about {title_lookback_years} years to confirm that each transfer was\
    \ validly made by a person entitled to transfer."
  "authority": "The seller, or certified copies from the Sub-Registrar's office"
  "next_action": "Collect each earlier deed referenced in the current title document and continue backwards until the review\
    \ period is covered."
  "risk_if_absent": "A defect in an earlier transfer can invalidate the present owner's title even if the latest deed appears\
    \ regular."
  "closure_criteria": "Every transfer in the chain for the review period is supported by a document that has been analysed."
  "name_kn": "ಪರಿಶೀಲನಾ ಅವಧಿಯ ಹಕ್ಕು ಸರಪಳಿಯ ಮೂಲ ದಾಖಲೆಗಳು"
  "reason_kn": "ಪ್ರತಿ ವರ್ಗಾವಣೆಯನ್ನು ಅಧಿಕಾರವಿರುವ ವ್ಯಕ್ತಿ ಮಾಡಿದ್ದಾರೆಯೇ ಎಂದು ಖಚಿತಪಡಿಸಲು ಹಕ್ಕು ಸರಪಳಿಯನ್ನು ಸುಮಾರು {title_lookback_years}\
    \ ವರ್ಷಗಳವರೆಗೆ ಪರಿಶೀಲಿಸುವುದು ರೂಢಿ."
  "authority_kn": "ಮಾರಾಟಗಾರರು, ಅಥವಾ ಉಪ ನೋಂದಣಾಧಿಕಾರಿಗಳ ಕಚೇರಿಯಿಂದ ದೃಢೀಕೃತ ಪ್ರತಿಗಳು"
  "next_action_kn": "ಪ್ರಸ್ತುತ ಹಕ್ಕು ದಾಖಲೆಯಲ್ಲಿ ಉಲ್ಲೇಖಿಸಲಾದ ಪ್ರತಿ ಹಿಂದಿನ ದಾಖಲೆಯನ್ನು ಸಂಗ್ರಹಿಸಿ, ಪರಿಶೀಲನಾ ಅವಧಿ ಪೂರ್ಣವಾಗುವವರೆಗೆ\
    \ ಹಿಂದಕ್ಕೆ ಮುಂದುವರಿಸಿ."
  "risk_if_absent_kn": "ಇತ್ತೀಚಿನ ದಾಖಲೆ ಸರಿಯಾಗಿ ಕಂಡರೂ, ಹಿಂದಿನ ವರ್ಗಾವಣೆಯಲ್ಲಿನ ದೋಷವು ಪ್ರಸ್ತುತ ಹಕ್ಕನ್ನು ಅಸಿಂಧುಗೊಳಿಸಬಹುದು."
  "closure_criteria_kn": "ಪರಿಶೀಲನಾ ಅವಧಿಯ ಪ್ರತಿ ವರ್ಗಾವಣೆಗೂ ವಿಶ್ಲೇಷಿಸಲಾದ ದಾಖಲೆ ಇದೆ."
