  "name_kn": "ಇತ್ತೀಚಿನ ಆಸ್ತಿ ತೆರಿಗೆ / ಭೂ ಕಂದಾಯ ಪಾವತಿ ರಸೀದಿಗಳು"
  "reason_kn": "ದಾಖಲೆಯಲ್ಲಿನ ತೆರಿಗೆದಾರರು ಯಾರು ಮತ್ತು ಯಾವುದೇ ಬಾಕಿ ಇಲ್ಲವೆಂಬುದನ್ನು ಇದು ದೃಢಪಡಿಸುತ್ತದೆ."
  "authority_kn": "ಬಿಬಿಎಂಪಿ / ನಗರಸಭೆ / ಗ್ರಾಮ ಪಂಚಾಯತ್ / ಗ್ರಾಮ ಲೆಕ್ಕಿಗರು"
  "next_action_kn": "ಮಾರಾಟಗಾರರ ಹೆಸರಿನಲ್ಲಿ ಪ್ರಸಕ್ತ ಮತ್ತು ಹಿಂದಿನ ವರ್ಷದ ತೆರಿಗೆ ಪಾವತಿ ರಸೀದಿಗಳನ್ನು ಪಡೆಯಿರಿ."
  "risk_if_absent_kn": "ಪಾವತಿಸದ ಬಾಕಿಯು ಸ್ವತ್ತಿನ ಮೇಲೆ ಭಾರವಾಗಬಹುದು ಮತ್ತು ಖರೀದಿಯ ನಂತರ ಖಾತೆ ವರ್ಗಾವಣೆಗೆ ಅಡ್ಡಿಯಾಗಬಹುದು."
  "closure_criteria_kn": "ಮಾರಾಟಗಾರರ ಹೆಸರಿನಲ್ಲಿ ಪ್ರಸಕ್ತ ವರ್ಷದ ರಸೀದಿಗಳಿದ್ದು ಯಾವುದೇ ಬಾಕಿ ಇಲ್ಲ."
