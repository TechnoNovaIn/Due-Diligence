  "name_kn": "ಪೂರ್ಣ ಪರಿಶೀಲನಾ ಅವಧಿಯ ಋಣಭಾರ ಪ್ರಮಾಣ ಪತ್ರ"
  "reason_kn": "ಪ್ರಮಾಣೀಕೃತ ಅವಧಿಯಲ್ಲಿ ಸ್ವತ್ತಿನ ಮೇಲೆ ನೋಂದಾಯಿಸಲಾದ ವ್ಯವಹಾರಗಳು, ಅಡಮಾನಗಳು ಮತ್ತು ಬಾಧ್ಯತೆಗಳನ್ನು ಇದು ತೋರಿಸುತ್ತದೆ."
  "authority_kn": "ಜಿಲ್ಲಾ ಉಪ ನೋಂದಣಾಧಿಕಾರಿಗಳ ಕಚೇರಿ / ಕಾವೇರಿ ಆನ್‌ಲೈನ್ ಸೇವೆಗಳು"
  "next_action_kn": "ಕನಿಷ್ಠ {ec_lookback_years} ವರ್ಷಗಳ ಋಣಭಾರ ಪ್ರಮಾಣ ಪತ್ರ (ನಮೂನೆ 15) ಪಡೆದು ಹಕ್ಕು ಸರಪಳಿಯೊಂದಿಗೆ ತಾಳೆ ಮಾಡಿ."
  "risk_if_absent_kn": "ನೋಂದಾಯಿತ ಅಡಮಾನಗಳು, ಜಪ್ತಿಗಳು ಅಥವಾ ಸ್ಪರ್ಧಾತ್ಮಕ ವರ್ಗಾವಣೆಗಳು ಪತ್ತೆಯಾಗದೆ ಉಳಿಯಬಹುದು."
  "closure_criteria_kn": "ಪೂರ್ಣ ಅವಧಿಯ ಪ್ರಮಾಣ ಪತ್ರವನ್ನು ವಿಶ್ಲೇಷಿಸಿ ಹಕ್ಕು ಸರಪಳಿಯೊಂದಿಗೆ ತಾಳೆ ಮಾಡಲಾಗಿದೆ."
- "key": "property_tax_receipts"
  "name": "Latest property tax / land revenue paid receipts"
  "category": "statutory"
  "priority": "mandatory"
  "property_types":
  - "all"
  "satisfied_by":
  - "property_tax_receipt"
  - "land_revenue_receipt"
