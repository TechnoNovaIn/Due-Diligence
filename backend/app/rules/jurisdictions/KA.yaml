  "name_kn": "ಮಾರಾಟಗಾರರ ಗುರುತು ಮತ್ತು ವರ್ಗಾಯಿಸುವ ಅಧಿಕಾರ"
  "reason_kn": "ವರ್ಗಾವಣೆ ಮಾಡುವ ವ್ಯಕ್ತಿಯೇ ಹಕ್ಕು ದಾಖಲೆಗಳಲ್ಲಿ ಹೆಸರಿಸಲಾದ ವ್ಯಕ್ತಿಯಾಗಿರಬೇಕು ಮತ್ತು ವರ್ಗಾಯಿಸಲು ಸಮರ್ಥರಾಗಿರಬೇಕು."
  "authority_kn": "ಮಾರಾಟಗಾರರು; ಹಕ್ಕು ದಾಖಲೆ ಮತ್ತು ಭಾವಚಿತ್ರ ಗುರುತಿನ ಚೀಟಿಯೊಂದಿಗೆ ತಾಳೆ"
  "next_action_kn": "ಭಾವಚಿತ್ರವಿರುವ ಗುರುತಿನ ದಾಖಲೆ ಪಡೆದು ಹೆಸರು, ತಂದೆಯ ಹೆಸರು ಮತ್ತು ವಿಳಾಸವನ್ನು ಹಕ್ಕು ದಾಖಲೆಯೊಂದಿಗೆ ತಾಳೆ ಮಾಡಿ."
  "risk_if_absent_kn": "ಸೋಗು ಹಾಕುವಿಕೆ, ಅಧಿಕಾರವಿಲ್ಲದ ವ್ಯಕ್ತಿಯಿಂದ ವರ್ಗಾವಣೆ ಅಥವಾ ಬಹಿರಂಗಪಡಿಸದ ಸಹ-ಮಾಲೀಕರ ಅಪಾಯ."
  "closure_criteria_kn": "ಗುರುತಿನ ದಾಖಲೆ ಸಲ್ಲಿಸಲಾಗಿದ್ದು ಹಕ್ಕು ದಾಖಲೆಗಳ ಹೆಸರುಗಳೊಂದಿಗೆ ತಾಳೆಯಾಗಿದೆ."
